<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" version="1.1" id="svg1" inkscape:version="1.4.3 (1:1.4.3+202512261034+0d15f75042)" width="17.9083mm" height="11.9004mm" viewBox="149.2274 30.9753 17.9083 11.9004" sodipodi:docname="scene31.svg">
  <sodipodi:namedview id="namedview1" pagecolor="#ffffff" bordercolor="#000000" borderopacity="0.25" inkscape:showpageshadow="2" inkscape:pageopacity="0.0" inkscape:pagecheckerboard="0" inkscape:deskcolor="#d1d1d1" inkscape:document-units="mm" inkscape:current-layer="layer1" />
  <defs id="defs1">
    </defs>
  <g inkscape:label="Layer 1" inkscape:groupmode="layer" id="layer1">
    <text xml:space="preserve" style="font-size:0.869147px;line-height:1.1;font-family:KacstScreen;-inkscape-font-specification:'KacstScreen, Normal';text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;opacity:1;fill:#000000;fill-opacity:1;fill-rule:evenodd;stroke:none;stroke-width:0.369559;stroke-linejoin:round;stroke-miterlimit:0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1;paint-order:stroke markers fill" x="158.05244" y="33.009918" id="text813"><tspan sodipodi:role="line" id="tspan813" style="stroke-width:0.369559" x="158.05244" y="33.009918">Conclusions</tspan></text>
    <text xml:space="preserve" style="font-size:0.352777px;line-height:1.1;font-family:KacstScreen;-inkscape-font-specification:'KacstScreen, Normal';text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;opacity:1;fill:#000000;fill-opacity:1;fill-rule:evenodd;stroke:none;stroke-width:0.15;stroke-linejoin:round;stroke-miterlimit:0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1;paint-order:stroke markers fill" x="158.3495" y="36.480713" id="text815"><tspan sodipodi:role="line" id="tspan815" style="stroke-width:0.15" x="158.3495" y="36.480713">The value of thinking in terms of optimization forces us, physicists, to confront</tspan><tspan sodipodi:role="line" style="stroke-width:0.15" x="158.3495" y="36.88023" id="tspan816">hard constraints imposed by real biology. These constraints are what set </tspan><tspan sodipodi:role="line" style="stroke-width:0.15" x="158.3495" y="37.279747" id="tspan818">the physical scales of solutions to biological problems, and determine the shapes they take.</tspan><tspan sodipodi:role="line" style="stroke-width:0.15" x="158.3495" y="37.679264" id="tspan821">We learn interesting things by confronting the fact that optimal solutions depend</tspan><tspan sodipodi:role="line" style="stroke-width:0.15" x="158.3495" y="38.078781" id="tspan822">intimately on the constraints they saturate, this sheds light on biologically meaningful </tspan><tspan sodipodi:role="line" style="stroke-width:0.15" x="158.3495" y="38.478302" id="tspan823">tradeoffs that evolution is subject to.</tspan></text>
    <text xml:space="preserve" style="font-size:0.352777px;line-height:1.1;font-family:KacstScreen;-inkscape-font-specification:'KacstScreen, Normal';text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;opacity:1;fill:#000000;fill-opacity:1;fill-rule:evenodd;stroke:none;stroke-width:0.15;stroke-linejoin:round;stroke-miterlimit:0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1;paint-order:stroke markers fill" x="158.31143" y="39.906132" id="text819"><tspan sodipodi:role="line" id="tspan819" style="stroke-width:0.15" x="158.31143" y="39.906132">There is no reason to believe that evolution optimizes individual components </tspan><tspan sodipodi:role="line" style="stroke-width:0.15" x="158.31143" y="40.305649" id="tspan824">independently of each other. A more realistic take is that the promoter's environment</tspan><tspan sodipodi:role="line" style="stroke-width:0.15" x="158.31143" y="40.705166" id="tspan825">plays an active role in the sensing process</tspan></text>
    </g>
</svg>