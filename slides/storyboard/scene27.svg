  <g inkscape:label="Layer 1" inkscape:groupmode="layer" id="layer1">
    <text xml:space="preserve" style="font-size:0.352777px;line-height:1.1;font-family:KacstScreen;-inkscape-font-specification:'KacstScreen, Normal';text-align:center;writing-mode:lr-tb;direction:ltr;text-anchor:middle;opacity:1;fill:#000000;fill-opacity:1;fill-rule:evenodd;stroke:none;stroke-width:0.0499999;stroke-linejoin:round;stroke-miterlimit:0;stroke-dasharray:none;stroke-dashoffset:0;stroke-opacity:1;paint-order:stroke markers fill" x="86.644073" y="40.2677" id="text630"><tspan sodipodi:role="line" id="tspan630" style="stroke-width:0.05" x="86.644073" y="40.2677">However something more interesting goes on when we think about the distal enhancer.</tspan><tspan sodipodi:role="line" style="stroke-width:0.05" x="86.644073" y="40.667217" id="tspan648">When two attractive surfaces come together, they form a capillary bridge. The formation of</tspan><tspan sodipodi:role="line" style="stroke-width:0.05" x="86.644073" y="41.066734" id="tspan649">this bridge is also very sensitive to concentration. So we solved the Cahn-Hilliard equation</tspan><tspan sodipodi:role="line" style="stroke-width:0.05" x="86.644073" y="41.466251" id="tspan653">with two spheres, and from there we could compute exactly the potential and the force </tspan><tspan sodipodi:role="line" style="stroke-width:0.05" x="86.644073" y="41.865768" id="tspan655">that arise from this capillary bridge, and crucially, their dependence on concentration.</tspan><tspan sodipodi:role="line" style="stroke-width:0.05" x="86.644073" y="42.253826" id="tspan654" /><tspan sodipodi:role="line" style="stroke-width:0.05" x="86.644073" y="42.64188" id="tspan643" /></text>
